<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrenador ECOE — EUNACOM (médico general)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Inter',sans-serif; background:#f0f9ff; color:#1e293b; }
    .fade { animation: fade .35s ease; }
    @keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
    .opt { transition: all .15s ease; }
    .opt:hover { border-color:#38bdf8; }
    .timer-warn { animation: pulse 1s infinite; }
    @keyframes pulse { 50%{opacity:.55;} }
    .scroll::-webkit-scrollbar{width:8px;} .scroll::-webkit-scrollbar-thumb{background:#7dd3fc;border-radius:8px;}
    input,select,textarea{ font-family:inherit; }
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="max-w-4xl mx-auto px-4 py-6"></div>

  <script src="data/00-core.js"></script>
  <script src="data/medint.js"></script>
  <script src="data/pediatria.js"></script>
  <script src="data/gineco.js"></script>
  <script src="data/cirugia.js"></script>
  <script src="data/transversal.js"></script>
  <script>
  // ============================ Persistencia ============================
  const LS_KEY = 'ecoe_progreso_v2';
  const LS_CUSTOM = 'ecoe_custom_v1';
  const store = {
    load(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || {intentos:[],circuitos:[]}; } catch(e){ return {intentos:[],circuitos:[]}; } },
    save(d){ localStorage.setItem(LS_KEY, JSON.stringify(d)); },
    addIntento(i){ const d=this.load(); d.intentos.push(i); this.save(d); },
    addCircuito(c){ const d=this.load(); (d.circuitos=d.circuitos||[]).push(c); this.save(d); },
    reset(){ localStorage.removeItem(LS_KEY); },
  };
  const custom = {
    load(){ try { return JSON.parse(localStorage.getItem(LS_CUSTOM)) || {}; } catch(e){ return {}; } },
    save(d){ localStorage.setItem(LS_CUSTOM, JSON.stringify(d)); },
    get(id){ return this.load()[id] || {opciones:{}, etapas:[]}; },
    set(id,val){ const d=this.load(); d[id]=val; this.save(d); },
    reset(id){ const d=this.load(); delete d[id]; this.save(d); },
  };

  // Reportes de contenido dudoso (para revisar y corregir después)
  const LS_DUDAS = 'ecoe_dudas_v1';
  const dudas = {
    load(){ try { return JSON.parse(localStorage.getItem(LS_DUDAS)) || []; } catch(e){ return []; } },
    add(d){ const l=this.load(); l.push(d); localStorage.setItem(LS_DUDAS, JSON.stringify(l)); },
    clear(){ localStorage.removeItem(LS_DUDAS); },
  };
  function reportarDuda(id){
    const e = ESTACIONES.find(x=>x.id===id);
    const txt = prompt(`Reportar duda — ${e.titulo}\n\n¿Qué no cuadra? (ítem, manejo, dosis, criterio...). Se guarda para revisarlo y corregirlo.`);
    if(txt===null || !txt.trim()) return;
    dudas.add({ estacionId:id, titulo:e.titulo, area:e.area, texto:txt.trim(), fecha:new Date().toISOString() });
    alert('Reporte guardado. Puedes exportarlos desde el inicio, al final de la página.');
  }
  function exportarDudas(){
    const l=dudas.load(); if(!l.length){ alert('No hay reportes guardados.'); return; }
    const txt = l.map(d=>`[${d.fecha.slice(0,10)}] ${AREAS[d.area]?AREAS[d.area].nombre:d.area} · ${d.titulo}\n  ${d.texto}`).join('\n\n');
    const blob = new Blob([`REPORTES DE CONTENIDO — Entrenador ECOE\n${'='.repeat(45)}\n\n${txt}\n`], {type:'text/plain;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ecoe-reportes.txt'; a.click(); URL.revokeObjectURL(a.href);
  }

  let sesion = null;    // estado de la estación en curso
  let circuito = null;  // { cola:[ids], idx, resultados:[], nombre }

  const app = document.getElementById('app');
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const badge = area => { const a=AREAS[area]; return `<span class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-full" style="background:${a.color}1a;color:${a.color}">${a.icono} ${a.nombre}</span>`; };
  // Dos niveles distintos: revisión de estructura ≠ validación clínica
  const sello = e => e.validacionClinica
    ? `<span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700" title="Contenido clínico verificado por ${esc(e.validacionClinica.por)}">✓ Validado clínicamente</span>`
    : e.revisionEstructura
      ? `<span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-100 text-sky-700" title="Formato y pauta revisados; contenido clínico aún sin verificar">Estructura revisada</span>`
      : `<span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700" title="Pendiente de revisión">Borrador</span>`;
  // Fase sugerida según la gestión de tiempo del informe UC
  function faseSugerida(tot,rest){
    const el=tot-rest;
    if(el < Math.min(60, tot*0.15)) return 'Apertura · seguridad, identidad, consentimiento, motivo';
    if(rest<=45) return 'Cierre · diagnóstico, signos de alarma, verificar comprensión';
    if(rest<=90) return 'Resolver · diagnóstico, estudio y manejo/destino';
    return 'Núcleo · anamnesis y examen focalizado';
  }

  // Construye la estación efectiva = base + contenido del alumno, ordenada por SEGURA
  function buildEstacion(baseId){
    const base = ESTACIONES.find(e=>e.id===baseId);
    const c = custom.get(baseId);
    let etapas = base.etapas.map((et,i)=>{
      const eid = baseId+'::'+i;
      const extra = (c.opciones[eid]||[]).map((o,k)=>({...o, id:'cu'+i+'_'+k, _custom:true}));
      return {...et, eid, opciones:[...et.opciones, ...extra]};
    });
    (c.etapas||[]).forEach((et,j)=>{
      const eid = baseId+'::c'+j;
      const ops = (c.opciones[eid]||[]).map((o,k)=>({...o, id:'ce'+j+'_'+k, _custom:true}));
      etapas.push({ comp:et.comp, tipo:et.tipo||'multi', instruccion:et.instruccion, eid, _customEtapa:true, opciones:ops });
    });
    etapas = etapas.map((et,idx)=>({et,idx}))
      .sort((a,b)=>(COMPETENCIAS.indexOf(a.et.comp)-COMPETENCIAS.indexOf(b.et.comp))||(a.idx-b.idx))
      .map(x=>x.et);
    return {...base, etapas};
  }

  // ============================ Home ============================
  function renderHome(){
    if(sesion && sesion.timer) clearInterval(sesion.timer);
    sesion=null; circuito=null;
    const d = store.load();
    const ultimo={}; d.intentos.forEach(i=>ultimo[i.estacionId]=i);

    // agrupar por área en orden del plan de 4 semanas
    const ordenAreas = Object.keys(AREAS).sort((a,b)=>AREAS[a].semana-AREAS[b].semana);
    const grupos = ordenAreas.map(ak=>{
      const ests = ESTACIONES.filter(e=>e.area===ak);
      if(!ests.length) return '';
      const cards = ests.map(e=>{
        const p=ultimo[e.id];
        const estado = p
          ? `<div class="mt-2 text-sm"><span class="font-bold" style="color:${p.aprobado?'#16a34a':'#dc2626'}">${p.aprobado?'✓ Aprobado':'✗ No aprobado'}</span> <span class="text-slate-500">· ${p.pct}%</span></div>`
          : `<div class="mt-2 text-sm text-slate-400">Sin intentos</div>`;
        return `<button onclick="verBriefing('${e.id}')" class="text-left bg-white rounded-2xl shadow-sm hover:shadow-md border border-sky-100 p-4 opt">
          <div class="flex justify-between items-start gap-2"><span class="text-xs text-slate-400">⏱ ${e.minutos} min</span>${sello(e)}</div>
          <h3 class="mt-1 font-bold leading-snug">${e.titulo}</h3>
          <p class="text-xs text-slate-500 mt-1">${esc(e.motivo)}</p>${estado}</button>`;
      }).join('');
      return `<div class="mt-6">
        <div class="flex items-center gap-2 mb-2">${badge(ak)}<span class="text-xs text-slate-400">Semana ${AREAS[ak].semana}</span></div>
        <div class="grid sm:grid-cols-2 gap-3">${cards}</div></div>`;
    }).join('');

    app.innerHTML = `
      <header class="mb-4 fade">
        <h1 class="text-3xl font-extrabold text-sky-900">Entrenador ECOE</h1>
        <p class="text-slate-600 mt-1">Sección práctica del EUNACOM · perfil de <b>médico/a general</b> · formato ECOE (UC)</p>
        <div class="mt-3 text-xs bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-3 py-2">
          ⚠️ <b>Ninguna estación cuenta todavía con validación clínica</b> por un profesional con experiencia vigente en el área. "Estructura revisada" significa que el <i>formato</i> de la estación fue aprobado, no su contenido médico. Úsalas para entrenar el <b>método</b> (SEGURA, gestión del tiempo, comunicación) y contrasta siempre el contenido con tus guías de estudio. Material original de práctica: no son casos oficiales ni bancos filtrados de la UC.
        </div>
      </header>

      <div class="bg-sky-600 text-white rounded-2xl p-5 fade">
        <div class="font-bold text-lg">🔁 Modo circuito</div>
        <p class="text-sky-100 text-sm mt-1">Encadena varias estaciones seguidas, como el examen real: cambios rápidos de especialidad y puntaje global.</p>
        <button onclick="renderCircuitoSetup()" class="mt-3 bg-white text-sky-700 font-bold px-4 py-2 rounded-xl">Armar circuito ▶</button>
      </div>

      ${renderResumen(d)}

      <details class="mt-6 bg-white rounded-2xl border border-sky-100 p-4">
        <summary class="cursor-pointer font-bold text-slate-700">📋 Algoritmo SEGURA y método (del informe UC)</summary>
        <div class="mt-3 text-sm text-slate-600 space-y-1">
          <p><b>S</b>eguridad inicial · higiene, identidad, consentimiento, estabilidad (ABCDE si urge).</p>
          <p><b>E</b>scuchar y explorar · motivo, cronología, síntomas, antecedentes, fármacos, alergias.</p>
          <p><b>G</b>ravedad · reconocer inestabilidad y actuar antes del diagnóstico completo.</p>
          <p><b>U</b>bicar el diagnóstico · síndrome, diagnóstico principal y diferenciales.</p>
          <p><b>R</b>esolver · exámenes, tratamiento y <b>destino</b> (ambulatorio / hospitalizar / derivar).</p>
          <p><b>A</b>segurar el cierre · educación, signos de alarma y verificar comprensión.</p>
          <p class="text-xs text-slate-400 pt-1">El ECOE no premia solo el diagnóstico: evalúa actuar como médico general seguro, estructurado y comunicativo.</p>
        </div>
      </details>

      <div class="mt-2 text-sm text-slate-500">Sugerencia del plan: comienza por <b>Medicina Interna (Semana 1)</b>.</div>
      ${grupos}

      <div class="mt-8 text-center space-x-4">
        ${dudas.load().length?`<button onclick="exportarDudas()" class="text-xs text-amber-600 hover:text-amber-700 underline">🚩 Exportar mis reportes de contenido (${dudas.load().length})</button>`:''}
        <button onclick="if(confirm('¿Borrar tu progreso local? (no afecta tus módulos personalizados)')){store.reset();renderHome();}" class="text-xs text-slate-400 hover:text-red-500 underline">Borrar mi progreso</button>
      </div>
      <footer class="mt-6 text-center text-xs text-slate-400">Módulo ECOE · Dr. Juan Carlos Riera · v2</footer>`;
    renderGraficoResumen(d);
  }

  function renderResumen(d){
    if(!d.intentos.length) return `<div class="bg-white rounded-2xl border border-sky-100 p-5 text-slate-500 mt-4 fade">Aún no tienes intentos. Elige una estación o arma un circuito para empezar.</div>`;
    const total=d.intentos.length, aprob=d.intentos.filter(i=>i.aprobado).length, prom=Math.round(d.intentos.reduce((s,i)=>s+i.pct,0)/total);
    return `<div class="bg-white rounded-2xl border border-sky-100 p-5 mt-4 fade">
      <div class="grid grid-cols-3 gap-4 text-center mb-4">
        <div><div class="text-2xl font-extrabold text-sky-700">${total}</div><div class="text-xs text-slate-500">Intentos</div></div>
        <div><div class="text-2xl font-extrabold text-emerald-600">${aprob}</div><div class="text-xs text-slate-500">Aprobados</div></div>
        <div><div class="text-2xl font-extrabold text-slate-700">${prom}%</div><div class="text-xs text-slate-500">Promedio</div></div>
      </div><canvas id="chartResumen" height="150"></canvas></div>`;
  }
  function renderGraficoResumen(d){
    const c=document.getElementById('chartResumen'); if(!c||typeof Chart==='undefined') return;
    const porEst={}; d.intentos.forEach(i=>porEst[i.estacionId]=i);
    const acc={}; COMPETENCIAS.forEach(k=>acc[k]={g:0,t:0});
    Object.values(porEst).forEach(i=>(i.porComp||[]).forEach(pc=>{ if(acc[pc.comp]){acc[pc.comp].g+=Math.max(0,pc.ganado); acc[pc.comp].t+=pc.total;} }));
    const labels=COMPETENCIAS.filter(k=>acc[k].t>0);
    const vals=labels.map(k=>Math.round(100*acc[k].g/acc[k].t));
    new Chart(c,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:vals.map(v=>v>=70?'#22c55e':v>=50?'#f59e0b':'#ef4444'),borderRadius:6}]},
      options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}}}}});
  }

  // ============================ Briefing ============================
  function verBriefing(id){
    const e = ESTACIONES.find(x=>x.id===id);
    const nCustom = (()=>{ const c=custom.get(id); return Object.values(c.opciones).reduce((s,a)=>s+a.length,0)+(c.etapas||[]).length; })();
    app.innerHTML = `<div class="fade">
      <button onclick="renderHome()" class="text-sm text-sky-600 mb-4">← Volver</button>
      <div class="bg-white rounded-2xl border border-sky-100 p-6 shadow-sm">
        ${badge(e.area)}
        <h1 class="text-2xl font-extrabold mt-3">${e.titulo}</h1>
        <p class="text-slate-500 mt-1">Nivel: ${e.nivel} · ⏱ ${e.minutos} min · ${sello(e)}</p>
        <div class="mt-4 bg-slate-50 border border-slate-200 rounded-xl p-4">
          <h3 class="font-bold text-slate-700 mb-1 text-sm">🚪 Instrucción de puerta</h3>
          <p class="text-slate-700 text-sm">${esc(e.puerta||e.briefing)}</p>
        </div>
        ${e.criterios?`<div class="mt-3">
          <h3 class="font-bold text-slate-700 text-sm mb-1">Criterios mínimos esperados</h3>
          <ul class="text-sm text-slate-600 list-disc pl-5 space-y-0.5">${e.criterios.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`:''}
        <div class="mt-3 bg-sky-50 border border-sky-100 rounded-xl p-4">
          <h3 class="font-bold text-sky-800 mb-1 text-sm">Viñeta clínica</h3>
          <p class="text-slate-700 text-sm">${esc(e.vineta)}</p>
        </div>
        ${(e.fuentes&&e.fuentes.length)?`<details class="mt-3 text-sm">
          <summary class="cursor-pointer text-slate-600 font-semibold">📚 Fuentes para contrastar este contenido</summary>
          <ul class="mt-2 text-xs text-slate-500 list-disc pl-5 space-y-1">${e.fuentes.map(f=>`<li>${esc(typeof FUENTES!=='undefined'&&FUENTES[f]?FUENTES[f]:f)}</li>`).join('')}</ul>
          <p class="text-[11px] text-slate-400 mt-1">Referencias sugeridas para verificar el contenido; la estación no las reproduce textualmente.</p>
        </details>`:''}
        <button onclick="iniciar('${e.id}')" class="mt-6 w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl">Iniciar estación ▶</button>
        <button onclick="renderPersonalizar('${e.id}')" class="mt-2 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl text-sm">🛠️ Personalizar estación (agregar módulos) ${nCustom?`· ${nCustom}`:''}</button>
        <button onclick="reportarDuda('${e.id}')" class="mt-2 w-full text-amber-700 hover:bg-amber-50 border border-amber-200 font-semibold py-2.5 rounded-xl text-sm">🚩 Reportar duda sobre el contenido</button>
      </div></div>`;
  }

  // ============================ Motor de estación ============================
  function iniciar(id){
    const e = buildEstacion(id);
    sesion = { estacion:e, etapaIdx:0, seleccion:{}, revelado:{}, tInicial:e.minutos*60, tRestante:e.minutos*60, timer:null };
    sesion.timer = setInterval(()=>{
      sesion.tRestante--;
      const t=document.getElementById('timer');
      if(t){ t.textContent=fmt(Math.max(0,sesion.tRestante)); if(sesion.tRestante<=60) document.getElementById('timerBox').classList.add('timer-warn','text-red-600'); }
      const fh=document.getElementById('faseHint'); if(fh) fh.textContent='⌛ Fase sugerida: '+faseSugerida(sesion.tInicial,sesion.tRestante);
      if(sesion.tRestante<=0) clearInterval(sesion.timer);
    },1000);
    renderEtapa();
  }

  function renderEtapa(){
    const e=sesion.estacion, idx=sesion.etapaIdx, etapa=e.etapas[idx];
    const sel=sesion.seleccion[idx]||[], revelado=sesion.revelado[idx];
    const progreso=e.etapas.map((et,i)=>`<div class="flex-1 h-1.5 rounded-full ${i<idx?'bg-emerald-400':i===idx?'bg-sky-500':'bg-slate-200'}"></div>`).join('');
    const opciones=etapa.opciones.length? etapa.opciones.map(o=>{
      const checked=sel.includes(o.id), showResp=revelado&&checked;
      let ring=checked?'border-sky-500 bg-sky-50':'border-slate-200 bg-white', mark='';
      if(revelado&&checked){ const good=o.tipo!=='peligroso'&&o.puntos>0;
        ring=good?'border-emerald-400 bg-emerald-50':o.tipo==='peligroso'?'border-red-400 bg-red-50':'border-slate-300 bg-slate-50';
        mark=good?'<span class="text-emerald-600 font-bold">✓</span>':o.tipo==='peligroso'?'<span class="text-red-600 font-bold">⚠</span>':'<span class="text-slate-400">•</span>'; }
      return `<div ${revelado?'':`onclick="toggle('${o.id}')"`} class="opt border-2 ${ring} rounded-xl p-3 ${revelado?'':'cursor-pointer'}">
        <div class="flex items-start gap-2"><div class="mt-0.5 w-5 text-center">${revelado?mark:(checked?'<span class="text-sky-600 font-bold">✓</span>':'<span class="text-slate-300">▢</span>')}</div>
        <div class="flex-1"><p class="text-sm font-medium text-slate-800">${esc(o.texto)}${o._custom?' <span class="text-[10px] text-violet-500 font-bold">(tuyo)</span>':''}</p>
        ${showResp?`<div class="mt-2 text-sm text-slate-600 bg-white/70 rounded-lg p-2 border border-slate-100"><b class="text-slate-500">Hallazgo:</b> ${esc(o.resp)||'—'}<br><b class="text-slate-500">Nota:</b> ${esc(o.fb)}</div>`:''}</div></div></div>`;
    }).join('') : `<div class="text-sm text-slate-400 italic p-3">Módulo sin opciones todavía. Agrégalas desde "Personalizar estación".</div>`;

    const esUltima=idx===e.etapas.length-1;
    const btn=!revelado
      ? `<button onclick="confirmarEtapa()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl">Confirmar ${etapa.tipo==='unica'?'respuesta':'selección'}</button>`
      : `<button onclick="${esUltima?'irAOral()':'siguienteEtapa()'}" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl">${esUltima?'Continuar ▶':'Siguiente etapa →'}</button>`;

    const cint = circuito? `<div class="text-xs text-sky-600 font-semibold mb-2">🔁 Circuito · estación ${circuito.idx+1}/${circuito.cola.length}</div>`:'';
    app.innerHTML=`<div class="fade">
      ${cint}
      <div class="flex items-center justify-between mb-3">${badge(e.area)}
        <div id="timerBox" class="font-mono font-bold text-lg text-slate-700 flex items-center gap-1">⏱ <span id="timer">${fmt(Math.max(0,sesion.tRestante))}</span></div></div>
      <div id="faseHint" class="text-[11px] text-slate-400 text-right mb-2">⌛ Fase sugerida: ${faseSugerida(sesion.tInicial,sesion.tRestante)}</div>
      <div class="flex gap-1 mb-4">${progreso}</div>
      <div class="bg-white rounded-2xl border border-sky-100 p-5 shadow-sm">
        <div class="text-xs font-bold uppercase tracking-wide text-sky-600">${etapa.comp} · etapa ${idx+1}/${e.etapas.length}</div>
        <h2 class="text-lg font-bold mt-1 mb-1">${esc(etapa.instruccion)}</h2>
        <p class="text-xs text-slate-400 mb-4">${etapa.tipo==='unica'?'Elige una opción.':'Puedes elegir varias. Las acciones innecesarias o riesgosas restan.'}</p>
        <div class="space-y-2 scroll">${opciones}</div>
        <div class="mt-5">${btn}</div>
      </div>
      <button onclick="if(confirm('¿Abandonar? No se guardará.')){circuito=null;renderHome();}" class="mt-4 text-xs text-slate-400 hover:text-red-500 underline">Abandonar</button>
    </div>`;
  }

  function toggle(optId){
    const idx=sesion.etapaIdx, etapa=sesion.estacion.etapas[idx];
    let sel=sesion.seleccion[idx]||[];
    sel = etapa.tipo==='unica' ? [optId] : (sel.includes(optId)?sel.filter(x=>x!==optId):[...sel,optId]);
    sesion.seleccion[idx]=sel; renderEtapa();
  }
  function confirmarEtapa(){
    const idx=sesion.etapaIdx, etapa=sesion.estacion.etapas[idx];
    if(etapa.tipo==='unica' && !(sesion.seleccion[idx]||[]).length){ alert('Selecciona una opción.'); return; }
    sesion.revelado[idx]=true; renderEtapa();
  }
  function siguienteEtapa(){ sesion.etapaIdx++; renderEtapa(); }

  function calcular(){
    const e=sesion.estacion; let ganado=0,total=0,peligrosCriticos=[],clavesCriticasOmitidas=[],dxCorrecto=true,huboDx=false;
    const porComp={}; COMPETENCIAS.forEach(k=>porComp[k]={comp:k,ganado:0,total:0});
    e.etapas.forEach((etapa,idx)=>{
      const sel=sesion.seleccion[idx]||[]; const cmp=porComp[etapa.comp]||(porComp[etapa.comp]={comp:etapa.comp,ganado:0,total:0});
      etapa.opciones.forEach(o=>{
        if(o.puntos>0){ total+=o.puntos; cmp.total+=o.puntos; }
        if(sel.includes(o.id)){ ganado+=o.puntos; cmp.ganado+=o.puntos; if(o.tipo==='peligroso'&&o.critico) peligrosCriticos.push(o.texto); }
        else if(o.tipo==='clave'&&o.critico) clavesCriticasOmitidas.push(o.texto);
      });
      if(etapa.comp==='Diagnóstico'&&etapa.tipo==='unica'){ huboDx=true; const el=etapa.opciones.find(o=>sel.includes(o.id)); dxCorrecto=!!(el&&el.tipo==='clave'); }
    });
    ganado=Math.max(0,ganado);
    const pct=total?Math.round(100*ganado/total):0;
    let aprobado = pct>=e.aprobacion.minPct;
    if(e.aprobacion.requiereDx && huboDx && !dxCorrecto) aprobado=false;
    if(peligrosCriticos.length) aprobado=false;
    if(clavesCriticasOmitidas.length) aprobado=false;
    return { estacionId:e.id, area:e.area, titulo:e.titulo, pct, ganado, total, aprobado, dxCorrecto:(!huboDx||dxCorrecto),
      peligrosCriticos, clavesCriticasOmitidas, tiempoAgotado:sesion.tRestante<=0,
      tiempoUsado:e.minutos*60-Math.max(0,sesion.tRestante), porComp:Object.values(porComp).filter(c=>c.total>0), fecha:new Date().toISOString() };
  }

  // Interrogación oral (autoevaluación, no afecta el puntaje de la estación)
  function irAOral(){
    if(sesion.timer) clearInterval(sesion.timer);
    const oral = sesion.estacion.oral || (typeof ORAL_DEFAULT!=='undefined'?ORAL_DEFAULT:[]);
    if(!oral.length) return finalizar();
    sesion.oral={ list:oral, rev:{}, ok:{} };
    renderOral();
  }
  function renderOral(){
    const o=sesion.oral;
    const items=o.list.map((q,i)=>`<div class="bg-white rounded-xl border border-sky-100 p-4 mb-3">
      <div class="font-semibold text-slate-800 text-sm">🗣️ ${esc(q.q)}</div>
      ${o.rev[i]
        ? `<div class="mt-2 text-sm text-slate-600 bg-sky-50 border border-sky-100 rounded-lg p-2"><b>Respuesta modelo:</b> ${esc(q.modelo)}</div>
           <label class="flex items-center gap-2 text-sm mt-2"><input type="checkbox" ${o.ok[i]?'checked':''} onchange="oralOk(${i},this.checked)"> La respondí bien</label>`
        : `<button onclick="oralRev(${i})" class="mt-2 text-sky-600 text-sm font-semibold">Ver respuesta modelo</button>`}
    </div>`).join('');
    app.innerHTML=`<div class="fade">
      <div class="text-xs font-bold uppercase text-sky-600 mb-1">Interrogación oral</div>
      <h1 class="text-xl font-bold mb-1">${sesion.estacion.titulo}</h1>
      <p class="text-sm text-slate-500 mb-4">Responde en voz alta (≈2 min) con la estructura sugerida, luego revela la respuesta modelo y autoevalúate. No modifica el puntaje de la estación.</p>
      ${items}
      <button onclick="finalizar()" class="w-full mt-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl">Terminar y ver resultados ▶</button>
    </div>`;
  }
  function oralRev(i){ sesion.oral.rev[i]=true; renderOral(); }
  function oralOk(i,v){ sesion.oral.ok[i]=v; }

  function finalizar(){
    if(sesion.timer) clearInterval(sesion.timer);
    const r=calcular();
    if(sesion.oral){ r.oral={ ok:Object.values(sesion.oral.ok).filter(Boolean).length, total:sesion.oral.list.length }; }
    store.addIntento(r);
    if(circuito){ circuito.resultados.push(r); return renderPasoCircuito(r); }
    renderResultado(r);
  }

  // ============================ Resultado individual ============================
  function renderResultado(r, contexto){
    const color=r.aprobado?'#16a34a':'#dc2626';
    const alertas=[];
    if(r.peligrosCriticos.length) alertas.push(`<b>Acción(es) de riesgo grave:</b> ${r.peligrosCriticos.map(esc).join('; ')}`);
    if(r.clavesCriticasOmitidas.length) alertas.push(`<b>Elemento(s) crítico(s) omitido(s):</b> ${r.clavesCriticasOmitidas.map(esc).join('; ')}`);
    if(!r.dxCorrecto) alertas.push('<b>Diagnóstico incorrecto.</b>');
    if(r.tiempoAgotado) alertas.push('<b>Se agotó el tiempo.</b>');
    const alertHtml=alertas.length?`<div class="mt-4 bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm space-y-1">${alertas.map(a=>`<div>• ${a}</div>`).join('')}</div>`:'';
    app.innerHTML=`<div class="fade">
      ${contexto||`<button onclick="renderHome()" class="text-sm text-sky-600 mb-4">← Volver al inicio</button>`}
      <div class="bg-white rounded-2xl border border-sky-100 p-6 shadow-sm text-center">
        ${badge(r.area)}<h1 class="text-xl font-bold mt-3">${r.titulo}</h1>
        <div class="text-6xl font-extrabold my-4" style="color:${color}">${r.pct}%</div>
        <div class="inline-block px-4 py-1.5 rounded-full font-bold text-white" style="background:${color}">${r.aprobado?'APROBADO':'NO APROBADO'}</div>
        <p class="text-sm text-slate-500 mt-3">Puntaje ${r.ganado}/${r.total} · Tiempo ${fmt(r.tiempoUsado)}</p>
        ${r.oral?`<p class="text-xs text-slate-500 mt-1">🗣️ Interrogación oral (autoevaluación): ${r.oral.ok}/${r.oral.total}</p>`:''}
        ${alertHtml}<canvas id="chartComp" height="140" class="mt-6"></canvas>
      </div>
      <h2 class="text-lg font-bold text-slate-700 mt-6 mb-3">Revisión por etapa</h2>${renderRevision()}
      <div class="grid grid-cols-2 gap-3 mt-6">
        <button onclick="verBriefing('${r.estacionId}')" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl">Repetir</button>
        <button onclick="renderHome()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl">Inicio</button>
      </div></div>`;
    chartComp(r);
  }
  function chartComp(r){
    const c=document.getElementById('chartComp'); if(!c||typeof Chart==='undefined') return;
    const labels=r.porComp.map(x=>x.comp), vals=r.porComp.map(x=>Math.round(100*Math.max(0,x.ganado)/x.total));
    new Chart(c,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:vals.map(v=>v>=70?'#22c55e':v>=50?'#f59e0b':'#ef4444'),borderRadius:6}]},
      options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}}}}});
  }
  function renderRevision(){
    const e=sesion.estacion;
    return e.etapas.map((etapa,idx)=>{
      const sel=sesion.seleccion[idx]||[];
      const items=etapa.opciones.map(o=>{
        const el=sel.includes(o.id); let icon,cls;
        if(o.tipo==='clave'||(o.tipo==='util'&&o.puntos>0)){ icon=el?'✓':'○'; cls=el?'text-emerald-600':'text-amber-600'; }
        else if(o.tipo==='peligroso'){ icon=el?'⚠':'·'; cls=el?'text-red-600':'text-slate-300'; }
        else { icon=el?'•':'·'; cls='text-slate-400'; }
        const dest=(o.tipo==='clave'&&o.critico&&!el)||(o.tipo==='peligroso'&&el);
        return `<li class="flex gap-2 text-sm ${dest?'font-semibold':''}"><span class="${cls} w-4 text-center">${icon}</span>
          <span class="flex-1 text-slate-700">${esc(o.texto)}${o.tipo==='clave'?'<span class="text-[10px] uppercase text-emerald-500 font-bold ml-1">clave</span>':''}${o.tipo==='peligroso'?'<span class="text-[10px] uppercase text-red-500 font-bold ml-1">riesgo</span>':''}${el&&o.fb?`<span class="block text-xs text-slate-400">${esc(o.fb)}</span>`:''}</span></li>`;
      }).join('');
      return `<div class="bg-white rounded-xl border border-sky-100 p-4 mb-3"><div class="text-xs font-bold uppercase text-sky-600 mb-2">${etapa.comp}</div><ul class="space-y-1.5">${items}</ul></div>`;
    }).join('');
  }

  // ============================ Modo circuito ============================
  function renderCircuitoSetup(){
    const ordenAreas=Object.keys(AREAS).sort((a,b)=>AREAS[a].semana-AREAS[b].semana);
    const porArea=ordenAreas.map(ak=>{
      const ests=ESTACIONES.filter(e=>e.area===ak); if(!ests.length) return '';
      return `<div class="mt-3"><div class="mb-1">${badge(ak)}</div>${ests.map(e=>`<label class="flex items-center gap-2 text-sm py-1"><input type="checkbox" class="ckEst" value="${e.id}"> ${esc(e.titulo)}</label>`).join('')}</div>`;
    }).join('');
    app.innerHTML=`<div class="fade">
      <button onclick="renderHome()" class="text-sm text-sky-600 mb-4">← Volver</button>
      <h1 class="text-2xl font-extrabold text-sky-900">Armar circuito</h1>
      <p class="text-slate-600 text-sm mt-1">Como el ECOE real, en un circuito debes <b>aprobar todas</b> las estaciones.</p>
      <div class="grid sm:grid-cols-2 gap-3 mt-4">
        <button onclick="startCircuitoCompleto()" class="bg-sky-600 text-white rounded-2xl p-4 text-left"><div class="font-bold">Circuito completo</div><div class="text-xs text-sky-100 mt-1">Una estación por cada área (MI, Pediatría, Obs-Gine, Cirugía).</div></button>
        <button onclick="document.getElementById('custBox').scrollIntoView({behavior:'smooth'})" class="bg-white border border-sky-100 rounded-2xl p-4 text-left"><div class="font-bold text-slate-700">Personalizado</div><div class="text-xs text-slate-500 mt-1">Elige tú mismo las estaciones abajo.</div></button>
      </div>
      <div id="custBox" class="bg-white rounded-2xl border border-sky-100 p-5 mt-4">
        <h3 class="font-bold text-slate-700 mb-1">Selecciona estaciones</h3>${porArea}
        <button onclick="startCircuitoCustom()" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl">Iniciar circuito seleccionado ▶</button>
      </div></div>`;
  }
  function startCircuito(ids,nombre){
    if(!ids.length){ alert('Selecciona al menos una estación.'); return; }
    circuito={ cola:ids, idx:0, resultados:[], nombre };
    iniciar(ids[0]);
  }
  function startCircuitoCompleto(){
    const ordenAreas=['medint','pediatria','gineco','cirugia'];
    const ids=ordenAreas.map(ak=>{ const e=ESTACIONES.find(x=>x.area===ak); return e&&e.id; }).filter(Boolean);
    startCircuito(ids,'Circuito completo');
  }
  function startCircuitoCustom(){
    const ids=[...document.querySelectorAll('.ckEst:checked')].map(c=>c.value);
    startCircuito(ids,'Circuito personalizado');
  }
  function renderPasoCircuito(r){
    const esUlt=circuito.idx>=circuito.cola.length-1;
    const ctx=`<div class="mb-4 text-sm text-sky-600 font-semibold">🔁 ${circuito.nombre} · estación ${circuito.idx+1}/${circuito.cola.length} completada</div>`;
    const btnLabel=esUlt?'Ver resultado del circuito ▶':'Siguiente estación →';
    // reutiliza el layout de resultado pero con botón de avance
    renderResultado(r, ctx);
    // reemplaza la botonera por avance de circuito
    const grid=app.querySelector('.grid.grid-cols-2'); if(grid) grid.outerHTML=`<button onclick="avanzarCircuito()" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl">${btnLabel}</button>`;
  }
  function avanzarCircuito(){
    if(circuito.idx>=circuito.cola.length-1) return renderResultadoCircuito();
    circuito.idx++; iniciar(circuito.cola[circuito.idx]);
  }
  function renderResultadoCircuito(){
    const rs=circuito.resultados, n=rs.length, aprob=rs.filter(r=>r.aprobado).length;
    const prom=Math.round(rs.reduce((s,r)=>s+r.pct,0)/n);
    const todo=aprob===n;
    store.addCircuito({ nombre:circuito.nombre, fecha:new Date().toISOString(), n, aprob, prom, aprobado:todo, estaciones:rs.map(r=>({id:r.estacionId,titulo:r.titulo,pct:r.pct,aprobado:r.aprobado})) });
    const color=todo?'#16a34a':'#dc2626';
    const lista=rs.map(r=>`<div class="flex items-center justify-between bg-white border border-sky-100 rounded-xl p-3 mb-2">
      <div class="flex items-center gap-2">${badge(r.area)}<span class="text-sm font-medium">${r.titulo}</span></div>
      <div class="text-sm font-bold" style="color:${r.aprobado?'#16a34a':'#dc2626'}">${r.pct}% ${r.aprobado?'✓':'✗'}</div></div>`).join('');
    const c=circuito; circuito=null;
    app.innerHTML=`<div class="fade">
      <div class="bg-white rounded-2xl border border-sky-100 p-6 shadow-sm text-center">
        <div class="text-xs font-bold uppercase text-sky-600">${esc(c.nombre)}</div>
        <div class="text-5xl font-extrabold my-3" style="color:${color}">${prom}%</div>
        <div class="inline-block px-4 py-1.5 rounded-full font-bold text-white" style="background:${color}">${todo?'CIRCUITO APROBADO':'CIRCUITO NO APROBADO'}</div>
        <p class="text-sm text-slate-500 mt-3">${aprob}/${n} estaciones aprobadas · promedio ${prom}%</p>
        <p class="text-xs text-slate-400 mt-1">En el ECOE se deben aprobar todas las estaciones de la etapa.</p>
      </div>
      <h2 class="text-lg font-bold text-slate-700 mt-6 mb-2">Detalle por estación</h2>${lista}
      <button onclick="renderHome()" class="w-full mt-4 bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl">Volver al inicio</button>
    </div>`;
  }

  // ============================ Personalizar (contenido del alumno) ============================
  function renderPersonalizar(id){
    const e=ESTACIONES.find(x=>x.id===id);
    const ef=buildEstacion(id);
    const c=custom.get(id);
    const modOptions=ef.etapas.map(et=>`<option value="${et.eid}">${et.comp} — ${esc(et.instruccion).slice(0,50)}</option>`).join('');
    // lista de añadidos del alumno
    let añadidos='';
    Object.entries(c.opciones).forEach(([eid,arr])=>arr.forEach((o,k)=>{
      añadidos+=`<div class="flex items-start justify-between gap-2 text-sm bg-violet-50 border border-violet-100 rounded-lg p-2 mb-1"><span>➕ <b>${esc(o.texto)}</b> <span class="text-xs text-slate-400">(${o.tipo}, ${o.puntos} pts)</span></span><button onclick="delOpcion('${id}','${eid}',${k})" class="text-red-500 text-xs">borrar</button></div>`;
    }));
    (c.etapas||[]).forEach((et,j)=>{
      añadidos+=`<div class="flex items-start justify-between gap-2 text-sm bg-violet-50 border border-violet-100 rounded-lg p-2 mb-1"><span>🧩 Módulo: <b>${esc(et.comp)}</b> — ${esc(et.instruccion)}</span><button onclick="delModulo('${id}',${j})" class="text-red-500 text-xs">borrar</button></div>`;
    });

    app.innerHTML=`<div class="fade">
      <button onclick="verBriefing('${id}')" class="text-sm text-sky-600 mb-4">← Volver a la estación</button>
      <h1 class="text-2xl font-extrabold text-sky-900">Personalizar: ${e.titulo}</h1>
      <p class="text-slate-600 text-sm mt-1">Agrega tus propios módulos y opciones. Se guardan en este navegador y se integran al practicar.</p>

      <div class="bg-white rounded-2xl border border-sky-100 p-5 mt-4">
        <h3 class="font-bold text-slate-700 mb-2">➕ Agregar opción a un módulo</h3>
        <label class="text-xs text-slate-500">Módulo</label>
        <select id="fOptMod" class="w-full border rounded-lg p-2 mb-2 text-sm">${modOptions}</select>
        <input id="fOptTexto" placeholder="Texto de la acción/pregunta" class="w-full border rounded-lg p-2 mb-2 text-sm">
        <div class="grid grid-cols-2 gap-2 mb-2">
          <select id="fOptTipo" class="border rounded-lg p-2 text-sm">
            <option value="clave">clave (correcta importante)</option>
            <option value="util">útil (aporta)</option>
            <option value="neutro">neutro (no suma)</option>
            <option value="peligroso">peligroso (resta)</option>
          </select>
          <input id="fOptPuntos" type="number" value="2" class="border rounded-lg p-2 text-sm" placeholder="puntos">
        </div>
        <input id="fOptResp" placeholder="Hallazgo / respuesta del paciente (opcional)" class="w-full border rounded-lg p-2 mb-2 text-sm">
        <input id="fOptFb" placeholder="Nota educativa (opcional)" class="w-full border rounded-lg p-2 mb-2 text-sm">
        <label class="flex items-center gap-2 text-sm mb-3"><input type="checkbox" id="fOptCritico"> Crítico (omitir clave / hacer peligroso reprueba)</label>
        <button onclick="addOpcion('${id}')" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-xl">Guardar opción</button>
      </div>

      <div class="bg-white rounded-2xl border border-sky-100 p-5 mt-4">
        <h3 class="font-bold text-slate-700 mb-2">🧩 Agregar un módulo nuevo</h3>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <select id="fModComp" class="border rounded-lg p-2 text-sm">${COMPETENCIAS.map(k=>`<option value="${k}">${k}</option>`).join('')}</select>
          <select id="fModTipo" class="border rounded-lg p-2 text-sm"><option value="multi">selección múltiple</option><option value="unica">una correcta</option></select>
        </div>
        <input id="fModInstr" placeholder="Instrucción del módulo (ej: ¿Qué preguntas hace?)" class="w-full border rounded-lg p-2 mb-3 text-sm">
        <button onclick="addModulo('${id}')" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl">Crear módulo</button>
        <p class="text-xs text-slate-400 mt-2">Luego agrégale opciones con el formulario de arriba (aparecerá en la lista de módulos).</p>
      </div>

      ${añadidos?`<div class="mt-4"><h3 class="font-bold text-slate-700 mb-2">Tus añadidos</h3>${añadidos}
        <button onclick="if(confirm('¿Borrar todo lo que agregaste en esta estación?')){custom.reset('${id}');renderPersonalizar('${id}');}" class="mt-2 text-xs text-red-500 underline">Borrar mis añadidos de esta estación</button></div>`:''}
    </div>`;
  }
  function addOpcion(id){
    const eid=document.getElementById('fOptMod').value;
    const texto=document.getElementById('fOptTexto').value.trim(); if(!texto){ alert('Escribe el texto de la opción.'); return; }
    let puntos=parseInt(document.getElementById('fOptPuntos').value,10); if(isNaN(puntos)) puntos=0;
    const tipo=document.getElementById('fOptTipo').value;
    if(tipo==='peligroso'&&puntos>0) puntos=-Math.abs(puntos);
    const o={ texto, tipo, puntos, critico:document.getElementById('fOptCritico').checked, resp:document.getElementById('fOptResp').value.trim(), fb:document.getElementById('fOptFb').value.trim() };
    const c=custom.get(id); (c.opciones[eid]=c.opciones[eid]||[]).push(o); custom.set(id,c); renderPersonalizar(id);
  }
  function addModulo(id){
    const comp=document.getElementById('fModComp').value, tipo=document.getElementById('fModTipo').value;
    const instr=document.getElementById('fModInstr').value.trim(); if(!instr){ alert('Escribe la instrucción del módulo.'); return; }
    const c=custom.get(id); (c.etapas=c.etapas||[]).push({comp,tipo,instruccion:instr}); custom.set(id,c); renderPersonalizar(id);
  }
  function delOpcion(id,eid,k){ const c=custom.get(id); if(c.opciones[eid]){ c.opciones[eid].splice(k,1); if(!c.opciones[eid].length) delete c.opciones[eid]; custom.set(id,c); renderPersonalizar(id); } }
  function delModulo(id,j){
    const c=custom.get(id); const etapas=c.etapas||[];
    const opsList=etapas.map((_,idx)=>c.opciones[id+'::c'+idx]||[]);
    etapas.splice(j,1); opsList.splice(j,1);
    Object.keys(c.opciones).forEach(k=>{ if(k.indexOf(id+'::c')===0) delete c.opciones[k]; });
    opsList.forEach((arr,idx)=>{ if(arr&&arr.length) c.opciones[id+'::c'+idx]=arr; });
    c.etapas=etapas; custom.set(id,c); renderPersonalizar(id);
  }

  // init
  renderHome();
  </script>
</body>
</html>
