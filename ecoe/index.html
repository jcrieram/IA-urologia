<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrenador ECOE — EUNACOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Inter',sans-serif; background:#f0f9ff; color:#1e293b; }
    .fade { animation: fade .35s ease; }
    @keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
    .opt { transition: all .15s ease; }
    .opt:hover { border-color:#38bdf8; }
    .timer-warn { animation: pulse 1s infinite; }
    @keyframes pulse { 50%{opacity:.55;} }
    .scroll::-webkit-scrollbar{width:8px;} .scroll::-webkit-scrollbar-thumb{background:#7dd3fc;border-radius:8px;}
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="max-w-4xl mx-auto px-4 py-6"></div>

  <script src="data.js"></script>
  <script>
  // ============================ Estado / persistencia ============================
  const LS_KEY = 'ecoe_progreso_v1';
  const store = {
    load(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || {intentos:[]}; } catch(e){ return {intentos:[]}; } },
    save(d){ localStorage.setItem(LS_KEY, JSON.stringify(d)); },
    addIntento(i){ const d=this.load(); d.intentos.push(i); this.save(d); },
    reset(){ localStorage.removeItem(LS_KEY); },
  };

  let sesion = null; // { estacion, etapaIdx, seleccion:{etapaIdx:[optId]}, tRestante, tInicial, timer }

  const app = document.getElementById('app');
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const badge = area => {
    const a = AREAS[area];
    return `<span class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-full"
      style="background:${a.color}1a;color:${a.color}">${a.icono} ${a.nombre}</span>`;
  };

  // ============================ Pantalla: Home / Dashboard ============================
  function renderHome(){
    if(sesion && sesion.timer){ clearInterval(sesion.timer); }
    sesion = null;
    const d = store.load();
    const porEstacion = {}; // ultimo intento por estacion
    d.intentos.forEach(i => { porEstacion[i.estacionId] = i; });

    const cards = ESTACIONES.map(e => {
      const prev = porEstacion[e.id];
      const estado = prev
        ? `<div class="mt-3 flex items-center gap-2 text-sm">
             <span class="font-bold" style="color:${prev.aprobado?'#16a34a':'#dc2626'}">
               ${prev.aprobado?'✓ Aprobado':'✗ No aprobado'}</span>
             <span class="text-slate-500">· último ${prev.pct}%</span>
           </div>`
        : `<div class="mt-3 text-sm text-slate-400">Sin intentos</div>`;
      return `
      <button onclick="verBriefing('${e.id}')" class="text-left bg-white rounded-2xl shadow-sm hover:shadow-md border border-sky-100 p-5 opt">
        <div class="flex justify-between items-start gap-3">
          ${badge(e.area)}
          <span class="text-xs text-slate-400 whitespace-nowrap">⏱ ${e.minutos} min</span>
        </div>
        <h3 class="mt-3 font-bold text-lg leading-snug">${e.titulo}</h3>
        <p class="text-sm text-slate-500 mt-1">${e.motivo}</p>
        ${estado}
      </button>`;
    }).join('');

    app.innerHTML = `
      <header class="mb-6 fade">
        <h1 class="text-3xl font-extrabold text-sky-900">Entrenador ECOE</h1>
        <p class="text-slate-600 mt-1">Simulacro de estaciones clínicas · EUNACOM (formato ECOE)</p>
        <div class="mt-3 text-xs bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-3 py-2">
          ⚠️ Herramienta educativa con contenido <b>borrador</b> pendiente de validación médica.
          No reemplaza el juicio clínico ni las guías vigentes.
        </div>
      </header>

      ${renderResumen(d)}

      <h2 class="text-lg font-bold text-slate-700 mt-8 mb-3">Estaciones disponibles</h2>
      <div class="grid sm:grid-cols-2 gap-4">${cards}</div>

      <div class="mt-8 text-center">
        <button onclick="if(confirm('¿Borrar todo tu progreso local?')){store.reset();renderHome();}"
          class="text-xs text-slate-400 hover:text-red-500 underline">Borrar mi progreso</button>
      </div>
      <footer class="mt-8 text-center text-xs text-slate-400">
        Módulo ECOE · Dr. Juan Carlos Riera · MVP v1
      </footer>`;

    renderGraficoResumen(d);
  }

  function renderResumen(d){
    if(!d.intentos.length){
      return `<div class="bg-white rounded-2xl border border-sky-100 p-5 text-slate-500 fade">
        Aún no tienes intentos. Elige una estación para comenzar tu primer simulacro.</div>`;
    }
    const total = d.intentos.length;
    const aprob = d.intentos.filter(i=>i.aprobado).length;
    const prom = Math.round(d.intentos.reduce((s,i)=>s+i.pct,0)/total);
    return `
      <div class="bg-white rounded-2xl border border-sky-100 p-5 fade">
        <div class="grid grid-cols-3 gap-4 text-center mb-4">
          <div><div class="text-2xl font-extrabold text-sky-700">${total}</div><div class="text-xs text-slate-500">Intentos</div></div>
          <div><div class="text-2xl font-extrabold text-emerald-600">${aprob}</div><div class="text-xs text-slate-500">Aprobados</div></div>
          <div><div class="text-2xl font-extrabold text-slate-700">${prom}%</div><div class="text-xs text-slate-500">Promedio</div></div>
        </div>
        <canvas id="chartResumen" height="150"></canvas>
      </div>`;
  }

  function renderGraficoResumen(d){
    const c = document.getElementById('chartResumen');
    if(!c) return;
    // promedio por competencia (último intento de cada estación)
    const porEst = {}; d.intentos.forEach(i=>porEst[i.estacionId]=i);
    const acc = {}; COMPETENCIAS.forEach(k=>acc[k]={g:0,t:0});
    Object.values(porEst).forEach(i=>{
      (i.porComp||[]).forEach(pc=>{ if(acc[pc.comp]){ acc[pc.comp].g+=pc.ganado; acc[pc.comp].t+=pc.total; } });
    });
    const labels = COMPETENCIAS;
    const vals = labels.map(k => acc[k].t? Math.round(100*acc[k].g/acc[k].t):0);
    new Chart(c, {
      type:'bar',
      data:{ labels, datasets:[{ label:'% logrado', data:vals,
        backgroundColor: vals.map(v=> v>=70?'#22c55e': v>=50?'#f59e0b':'#ef4444'), borderRadius:6 }]},
      options:{ plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}} } }
    });
  }

  // ============================ Pantalla: Briefing ============================
  function verBriefing(id){
    const e = ESTACIONES.find(x=>x.id===id);
    app.innerHTML = `
      <div class="fade">
        <button onclick="renderHome()" class="text-sm text-sky-600 mb-4">← Volver</button>
        <div class="bg-white rounded-2xl border border-sky-100 p-6 shadow-sm">
          ${badge(e.area)}
          <h1 class="text-2xl font-extrabold mt-3">${e.titulo}</h1>
          <p class="text-slate-500 mt-1">Nivel: ${e.nivel} · ⏱ ${e.minutos} minutos</p>
          <div class="mt-5">
            <h3 class="font-bold text-slate-700 mb-1">Instrucciones para el alumno</h3>
            <p class="text-slate-600 text-sm leading-relaxed">${e.briefing}</p>
          </div>
          <div class="mt-4 bg-sky-50 border border-sky-100 rounded-xl p-4">
            <h3 class="font-bold text-sky-800 mb-1 text-sm">Viñeta clínica</h3>
            <p class="text-slate-700 text-sm leading-relaxed">${e.vineta}</p>
          </div>
          <div class="mt-4 text-xs text-slate-500">
            El cronómetro empieza al iniciar. Podrás terminar aunque se agote el tiempo, pero quedará registrado.
          </div>
          <button onclick="iniciar('${e.id}')"
            class="mt-6 w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl">
            Iniciar estación ▶</button>
        </div>
      </div>`;
  }

  // ============================ Motor de estación ============================
  function iniciar(id){
    const e = ESTACIONES.find(x=>x.id===id);
    sesion = { estacion:e, etapaIdx:0, seleccion:{}, tInicial:e.minutos*60, tRestante:e.minutos*60, timer:null, revelado:{} };
    sesion.timer = setInterval(()=>{
      sesion.tRestante--;
      const t = document.getElementById('timer');
      if(t){ t.textContent = fmt(Math.max(0,sesion.tRestante)); if(sesion.tRestante<=60) t.parentElement.classList.add('timer-warn','text-red-600'); }
      if(sesion.tRestante<=0){ clearInterval(sesion.timer); }
    },1000);
    renderEtapa();
  }

  function renderEtapa(){
    const e = sesion.estacion, idx = sesion.etapaIdx, etapa = e.etapas[idx];
    const sel = sesion.seleccion[idx] || [];
    const revelado = sesion.revelado[idx];

    const progreso = e.etapas.map((et,i)=>`
      <div class="flex-1 h-1.5 rounded-full ${i<idx?'bg-emerald-400':i===idx?'bg-sky-500':'bg-slate-200'}"></div>`).join('');

    const opciones = etapa.opciones.map(o=>{
      const checked = sel.includes(o.id);
      const showResp = revelado && checked;
      let ring = checked ? 'border-sky-500 bg-sky-50' : 'border-slate-200 bg-white';
      let mark = '';
      if(revelado){
        if(checked){
          const good = o.tipo!=='peligroso' && o.puntos>0;
          ring = good ? 'border-emerald-400 bg-emerald-50' : o.tipo==='peligroso' ? 'border-red-400 bg-red-50' : 'border-slate-300 bg-slate-50';
          mark = good ? '<span class="text-emerald-600 font-bold">✓</span>' : o.tipo==='peligroso' ? '<span class="text-red-600 font-bold">⚠</span>' : '<span class="text-slate-400">•</span>';
        }
      }
      const clickable = revelado ? '' : `onclick="toggle('${o.id}')"`;
      return `
      <div ${clickable} class="opt border-2 ${ring} rounded-xl p-3 ${revelado?'':'cursor-pointer'}">
        <div class="flex items-start gap-2">
          <div class="mt-0.5 w-5 text-center">${revelado?mark:(checked?'<span class="text-sky-600 font-bold">✓</span>':'<span class="text-slate-300">▢</span>')}</div>
          <div class="flex-1">
            <p class="text-sm font-medium text-slate-800">${o.texto}</p>
            ${showResp?`<div class="mt-2 text-sm text-slate-600 bg-white/70 rounded-lg p-2 border border-slate-100">
                <b class="text-slate-500">Hallazgo:</b> ${o.resp||'—'}<br>
                <b class="text-slate-500">Nota:</b> ${o.fb||''}</div>`:''}
          </div>
        </div>
      </div>`;
    }).join('');

    const esUltima = idx === e.etapas.length-1;
    const btn = !revelado
      ? `<button onclick="confirmarEtapa()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl">
           Confirmar ${etapa.tipo==='unica'?'respuesta':'selección'}</button>`
      : `<button onclick="${esUltima?'finalizar()':'siguienteEtapa()'}" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl">
           ${esUltima?'Ver resultados ▶':'Siguiente etapa →'}</button>`;

    app.innerHTML = `
      <div class="fade">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-slate-500">${badge(e.area)}</span>
          <div id="timerBox" class="font-mono font-bold text-lg text-slate-700 flex items-center gap-1">
            ⏱ <span id="timer">${fmt(Math.max(0,sesion.tRestante))}</span>
          </div>
        </div>
        <div class="flex gap-1 mb-4">${progreso}</div>

        <div class="bg-white rounded-2xl border border-sky-100 p-5 shadow-sm">
          <div class="text-xs font-bold uppercase tracking-wide text-sky-600">${etapa.comp} · etapa ${idx+1}/${e.etapas.length}</div>
          <h2 class="text-lg font-bold mt-1 mb-1">${etapa.instruccion}</h2>
          <p class="text-xs text-slate-400 mb-4">${etapa.tipo==='unica'?'Elige una opción.':'Puedes elegir varias. Las acciones innecesarias o riesgosas restan.'}</p>
          <div class="space-y-2 scroll">${opciones}</div>
          <div class="mt-5">${btn}</div>
        </div>
        <button onclick="if(confirm('¿Abandonar la estación? No se guardará.')){renderHome();}"
          class="mt-4 text-xs text-slate-400 hover:text-red-500 underline">Abandonar</button>
      </div>`;
  }

  function toggle(optId){
    const idx = sesion.etapaIdx, etapa = sesion.estacion.etapas[idx];
    let sel = sesion.seleccion[idx] || [];
    if(etapa.tipo==='unica'){ sel = [optId]; }
    else { sel = sel.includes(optId) ? sel.filter(x=>x!==optId) : [...sel, optId]; }
    sesion.seleccion[idx] = sel;
    renderEtapa();
  }

  function confirmarEtapa(){
    const idx = sesion.etapaIdx;
    if(!(sesion.seleccion[idx]||[]).length && sesion.estacion.etapas[idx].tipo==='unica'){
      alert('Selecciona una opción.'); return;
    }
    sesion.revelado[idx] = true;
    renderEtapa();
  }
  function siguienteEtapa(){ sesion.etapaIdx++; renderEtapa(); }

  // ============================ Cálculo de resultado ============================
  function calcular(){
    const e = sesion.estacion;
    let ganado=0, total=0, peligrosCriticos=[], clavesCriticasOmitidas=[], dxCorrecto=true;
    const porComp = {}; COMPETENCIAS.forEach(k=>porComp[k]={comp:k,ganado:0,total:0});

    e.etapas.forEach((etapa,idx)=>{
      const sel = sesion.seleccion[idx]||[];
      const cmp = porComp[etapa.comp] || (porComp[etapa.comp]={comp:etapa.comp,ganado:0,total:0});
      etapa.opciones.forEach(o=>{
        if(o.puntos>0){ total+=o.puntos; cmp.total+=o.puntos; }
        const elegida = sel.includes(o.id);
        if(elegida){
          ganado += o.puntos;                    // peligrosos restan
          cmp.ganado += o.puntos;
          if(o.tipo==='peligroso' && o.critico) peligrosCriticos.push(o.texto);
        } else {
          if(o.tipo==='clave' && o.critico) clavesCriticasOmitidas.push(o.texto);
        }
      });
      if(etapa.comp==='Diagnóstico' && etapa.tipo==='unica'){
        const elegido = etapa.opciones.find(o=>sel.includes(o.id));
        dxCorrecto = !!(elegido && elegido.tipo==='clave');
      }
    });

    ganado = Math.max(0, ganado);
    const pct = total? Math.round(100*ganado/total):0;
    let aprobado = pct >= e.aprobacion.minPct;
    if(e.aprobacion.requiereDx && !dxCorrecto) aprobado=false;
    if(peligrosCriticos.length) aprobado=false;
    if(clavesCriticasOmitidas.length) aprobado=false;
    const tiempoAgotado = sesion.tRestante<=0;

    return {
      estacionId:e.id, area:e.area, titulo:e.titulo,
      pct, ganado, total, aprobado, dxCorrecto,
      peligrosCriticos, clavesCriticasOmitidas, tiempoAgotado,
      tiempoUsado: e.minutos*60 - Math.max(0,sesion.tRestante),
      porComp: Object.values(porComp).filter(c=>c.total>0),
      fecha: new Date().toISOString(),
    };
  }

  function finalizar(){
    if(sesion.timer) clearInterval(sesion.timer);
    const r = calcular();
    store.addIntento(r);
    renderResultado(r);
  }

  // ============================ Pantalla: Resultado ============================
  function renderResultado(r){
    const color = r.aprobado ? '#16a34a' : '#dc2626';
    const alertas = [];
    if(r.peligrosCriticos.length) alertas.push(`<b>Acción(es) de riesgo grave:</b> ${r.peligrosCriticos.join('; ')}`);
    if(r.clavesCriticasOmitidas.length) alertas.push(`<b>Elemento(s) crítico(s) omitido(s):</b> ${r.clavesCriticasOmitidas.join('; ')}`);
    if(!r.dxCorrecto) alertas.push('<b>Diagnóstico incorrecto.</b>');
    if(r.tiempoAgotado) alertas.push('<b>Se agotó el tiempo.</b>');

    const alertHtml = alertas.length
      ? `<div class="mt-4 bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm space-y-1">
           ${alertas.map(a=>`<div>• ${a}</div>`).join('')}</div>` : '';

    const revision = renderRevision();

    app.innerHTML = `
      <div class="fade">
        <button onclick="renderHome()" class="text-sm text-sky-600 mb-4">← Volver al inicio</button>
        <div class="bg-white rounded-2xl border border-sky-100 p-6 shadow-sm text-center">
          ${badge(r.area)}
          <h1 class="text-xl font-bold mt-3">${r.titulo}</h1>
          <div class="text-6xl font-extrabold my-4" style="color:${color}">${r.pct}%</div>
          <div class="inline-block px-4 py-1.5 rounded-full font-bold text-white" style="background:${color}">
            ${r.aprobado?'APROBADO':'NO APROBADO'}</div>
          <p class="text-sm text-slate-500 mt-3">
            Puntaje ${r.ganado}/${r.total} · Tiempo usado ${fmt(r.tiempoUsado)}
          </p>
          ${alertHtml}
          <canvas id="chartComp" height="140" class="mt-6"></canvas>
        </div>

        <h2 class="text-lg font-bold text-slate-700 mt-6 mb-3">Revisión por etapa</h2>
        ${revision}

        <div class="grid grid-cols-2 gap-3 mt-6">
          <button onclick="verBriefing('${r.estacionId}')" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl">Repetir estación</button>
          <button onclick="renderHome()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl">Otra estación</button>
        </div>
      </div>`;

    // gráfico por competencia
    const c = document.getElementById('chartComp');
    const labels = r.porComp.map(x=>x.comp);
    const vals = r.porComp.map(x=> x.total? Math.round(100*Math.max(0,x.ganado)/x.total):0);
    new Chart(c,{ type:'bar', data:{labels,datasets:[{data:vals,
      backgroundColor:vals.map(v=>v>=70?'#22c55e':v>=50?'#f59e0b':'#ef4444'),borderRadius:6}]},
      options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}}}}});
  }

  function renderRevision(){
    const e = sesion.estacion;
    return e.etapas.map((etapa,idx)=>{
      const sel = sesion.seleccion[idx]||[];
      const items = etapa.opciones.map(o=>{
        const elegida = sel.includes(o.id);
        let icon, cls;
        if(o.tipo==='clave' || (o.tipo==='util'&&o.puntos>0)){
          icon = elegida?'✓':'○'; cls = elegida?'text-emerald-600':'text-amber-600';
        } else if(o.tipo==='peligroso'){
          icon = elegida?'⚠':'·'; cls = elegida?'text-red-600':'text-slate-300';
        } else { icon = elegida?'•':'·'; cls='text-slate-400'; }
        const destacar = (o.tipo==='clave'&&o.critico&&!elegida) || (o.tipo==='peligroso'&&elegida);
        return `<li class="flex gap-2 text-sm ${destacar?'font-semibold':''}">
          <span class="${cls} w-4 text-center">${icon}</span>
          <span class="flex-1 text-slate-700">${o.texto}
            ${(o.tipo==='clave')?'<span class="text-[10px] uppercase text-emerald-500 font-bold ml-1">clave</span>':''}
            ${(o.tipo==='peligroso')?'<span class="text-[10px] uppercase text-red-500 font-bold ml-1">riesgo</span>':''}
            ${(elegida&&o.fb)?`<span class="block text-xs text-slate-400">${o.fb}</span>`:''}
          </span></li>`;
      }).join('');
      return `<div class="bg-white rounded-xl border border-sky-100 p-4 mb-3">
        <div class="text-xs font-bold uppercase text-sky-600 mb-2">${etapa.comp}</div>
        <ul class="space-y-1.5">${items}</ul></div>`;
    }).join('');
  }

  // ============================ init ============================
  renderHome();
  </script>
</body>
</html>
