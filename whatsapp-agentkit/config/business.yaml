# Configuración del negocio — Generado por AgentKit
negocio:
  nombre: "Dr. Juan Carlos Riera — Urología"
  descripcion: >-
    Atención urológica especializada del Dr. Juan Carlos Riera en tres ciudades
    de la Región de Valparaíso, Chile: La Ligua, Quilpué y Viña del Mar. El
    paciente elige el centro que le quede más cómodo y coordina su hora de
    evaluación con la ejecutiva de esa clínica.
