    ciudad: "La Ligua"
    reserva: "PENDIENTE — enlace o teléfono de reserva"
  - nombre: "Clínica Los Carrera (Interclínica)"
    ciudad: "Quilpué"
    reserva: "PENDIENTE — enlace o teléfono de reserva"
  - nombre: "Interclínica Viña del Mar"
    ciudad: "Viña del Mar"
    reserva: "PENDIENTE — enlace o teléfono de reserva"

# PENDIENTE: motivos de consulta y procedimientos que ofrece la consulta.
# Mientras esté vacío, Gladys dice que no tiene el detalle y ofrece la cita
# en vez de inventar una lista de prestaciones.
